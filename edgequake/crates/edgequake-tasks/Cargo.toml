[package]
name = "edgequake-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
edgequake-pdf = { path = "../edgequake-pdf" }

# SPEC-091 QW2: transition + provider budget Prometheus counters
edgequake-observability = { path = "../edgequake-observability", features = ["metrics"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# OpenAPI schema generation (optional — enabled by edgequake-api)
utoipa = { workspace = true, optional = true }

# Async traits
async-trait = "0.1"

# CPU detection
num_cpus = "1.16"

# Redis (optional)
redis = { version = "1.5", features = [
    "tokio-comp",
    "tokio-rustls-comp",
], optional = true }

# Database (optional, for persistence)
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-rustls",
    "chrono",
    "uuid",
    "json",
], optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["memory"]
memory = []
redis-queue = ["redis"]
postgres = ["sqlx"]
openapi = ["dep:utoipa"]
