[package]
name = "edgequake-pdf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF to Markdown extraction with AI enhancement for EdgeQuake"

[[bin]]
name = "edgequake-pdf"
path = "src/bin.rs"

[features]
# Default features include lopdf backend for native PDF parsing
default = ["lopdf"]
lopdf = ["dep:lopdf"]

[dependencies]
# Workspace dependencies
edgequake-llm.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow.workspace = true
futures.workspace = true

# lopdf - local path dependency for PDF parsing
lopdf = { version = "0.32", optional = true, default-features = false, features = ["nom_parser"] }

# Image processing (match pdf_oxide's version)
image = "0.24"
base64 = "0.22"
regex = "1.10"

# Temporary file handling for PDF bytes
tempfile = "3.10"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
