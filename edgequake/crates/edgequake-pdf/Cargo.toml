[package]
name = "edgequake-pdf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF to Markdown extraction with AI enhancement for EdgeQuake"

[[bin]]
name = "edgequake-pdf"
path = "src/bin.rs"

[features]
default = ["lopdf"]
pdfium = ["dep:pdfium-render"]
lopdf = ["dep:lopdf"]

[dependencies]
# Workspace dependencies
edgequake-llm.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow.workspace = true
futures.workspace = true

# PDF processing with lopdf - pure Rust, no external dependencies
lopdf = { version = "0.38", optional = true }

# PDF processing - pdfium-render for SOTA quality with character-level positions
# Disable default features to avoid image version conflicts, explicitly use image 0.24 and pdfium API version
pdfium-render = { version = "0.8", optional = true, default-features = false, features = [
    "image_024",
    "thread_safe",
    "sync",
    "pdfium_latest",
] }

# Image processing (match pdf_oxide's version)
image = "0.24"
base64 = "0.22"
regex = "1.10"

# Temporary file handling for PDF bytes
tempfile = "3.10"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
