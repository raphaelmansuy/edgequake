[package]
name = "edgequake-storage"
description = "Storage abstractions and adapters for EdgeQuake RAG system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
observability = ["dep:edgequake-observability"]
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
qdrant = ["dep:reqwest"]
neo4j = ["dep:reqwest"]
p3 = ["sqlite", "neo4j", "qdrant"]
# Enable all storage backends
full = ["postgres", "sqlite", "qdrant", "neo4j"]

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
unicode-normalization = "0.1"
edgequake-storage-contracts = { workspace = true }

# Optional PostgreSQL dependencies
sqlx = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
chrono = { workspace = true }

edgequake-observability = { path = "../edgequake-observability", optional = true, features = ["metrics"] }

[dev-dependencies]
tokio-test = { workspace = true }
proptest = "1.6"
uuid = { version = "1.19", features = ["v4"] }
# WHY: test-only auto-provisioning of the dedicated scratch database runs
# `sqlx::migrate!` (see tests/support/postgres_test_config.rs). The `migrate`
# feature is not enabled for the library itself, only for tests.
sqlx = { workspace = true, features = ["migrate"] }
tracing-subscriber = { workspace = true }
tempfile = "3.10"
