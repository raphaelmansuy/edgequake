[package]
name = "edgequake-core"
description = "Core types and utilities for EdgeQuake RAG system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# SPEC-096: pipeline is default so workspace language helpers share SUPPORTED_LANGUAGES.
default = ["pipeline"]
pipeline = ["dep:edgequake-pipeline"]
# SPEC-096: postgres workspace metadata helpers share SUPPORTED_LANGUAGES via pipeline.
postgres = ["edgequake-storage/postgres", "dep:sqlx", "sqlx/postgres", "pipeline"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
md5 = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tiktoken-rs = { workspace = true }
edgequake-llm.workspace = true
edgequake-pdf = { workspace = true }
edgequake-storage = { path = "../edgequake-storage", default-features = false }
edgequake-pipeline = { workspace = true, optional = true }
edgequake-query = { path = "../edgequake-query", default-features = false }
async-trait.workspace = true
futures = { workspace = true }
lru = "0.16"
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
tokio-test = { workspace = true }
edgequake-query = { path = "../edgequake-query" }
edgequake-storage = { path = "../edgequake-storage" }
tempfile = "3.10"
serial_test = "3"
