services:
  # SPEC-150: schema migrate before API (never auto-apply on serve)
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ENABLE_OTEL: ${ENABLE_OTEL:-true}
    container_name: edgequake-migrate
    restart: "no"
    environment:
      - DATABASE_URL=postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@postgres:5432/edgequake
      - EDGEQUAKE_MIGRATE_CLI=1
      - EDGEQUAKE_LLM_PROVIDER=mock
      - EDGEQUAKE_EMBEDDING_PROVIDER=mock
      - EDGEQUAKE_ALLOW_MOCK_PROVIDER=1
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edgequake-network

  # EdgeQuake API Server
  # Multi-platform: supports linux/amd64 (Intel/AMD), linux/arm64 (Apple Silicon, ARM servers)
  # macOS:   docker compose up  (Docker Desktop auto-selects arm64 on M-series, amd64 on Intel)
  # Linux:   docker compose up  (uses native architecture)
  # Windows: docker compose up  (uses linux/amd64 via WSL2)
  # Override: DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose up
  # Multi-arch build: docker buildx build --platform linux/amd64,linux/arm64 -t edgequake .
  edgequake:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ENABLE_OTEL: ${ENABLE_OTEL:-true}
    container_name: edgequake
    restart: unless-stopped
    # SPEC-006 P2: cgroup memory cap — last line of defense against exit 137 (OOM kill)
    mem_limit: ${EDGEQUAKE_MEM_LIMIT:-4g}
    ports:
      - "${EDGEQUAKE_PORT:-8080}:8080"
    environment:
      - EDGEQUAKE_HOST=0.0.0.0
      - EDGEQUAKE_PORT=8080
      - DATABASE_URL=postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@postgres:5432/edgequake
      # SPEC-150: wait for migrate Job instead of exit 78
      - EDGEQUAKE_SCHEMA_GATE=${EDGEQUAKE_SCHEMA_GATE:-wait}
      # The provider is resolved in this order (first non-empty variable wins):
      #   EDGEQUAKE_DEFAULT_LLM_PROVIDER → EDGEQUAKE_LLM_PROVIDER → "ollama"
      #
      # Quick-start recipes:
      #
      #   Ollama (default, local):
      #     EDGEQUAKE_LLM_PROVIDER=ollama          (or omit — ollama is default)
      #     OLLAMA_HOST=http://host.docker.internal:11434
      #
      #   OpenAI / OpenAI-compatible:
      #     EDGEQUAKE_LLM_PROVIDER=openai
      #     OPENAI_API_KEY=sk-…
      #     OPENAI_BASE_URL=https://api.openai.com/v1   # optional override
      #
      #   LM Studio (local OpenAI-compatible):
      #     EDGEQUAKE_LLM_PROVIDER=lmstudio
      #     LMSTUDIO_HOST=http://host.docker.internal:1234
      #
      # Do NOT set OLLAMA_HOST when using OpenAI — the provider factory detects
      # Ollama via OLLAMA_HOST presence and will prefer it over OPENAI_API_KEY
      # unless EDGEQUAKE_LLM_PROVIDER is set explicitly (see issue #147).
      # ────────────────────────────────────────────────────────────────────────
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Optional: override the OpenAI-compatible base URL (e.g. Azure, vLLM, etc.)
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # FIX-DOCKER-OLLAMA: Use host.docker.internal to reach Ollama on the host
      # machine. Without this, the container tries localhost:11434 which points
      # to the container itself, causing "connection refused" and vision extraction
      # timeouts that leave documents stuck in "processing" forever.
      # On macOS/Windows Docker Desktop, host.docker.internal resolves to the host.
      # On Linux, add `extra_hosts: ["host.docker.internal:host-gateway"]` below.
      # NOTE: Only set OLLAMA_HOST when you actually want to use Ollama.
      #       Remove or leave blank when using OpenAI / another cloud provider.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      # WHY: Expose OLLAMA_CONTEXT_LENGTH so users can tune token window without
      # rebuilding the image. Ollama default is 2048 which is too small for many
      # documents; common override is 32768 or 131072.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-32768}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-}
      - EDGEQUAKE_LLM_PROVIDER=${EDGEQUAKE_LLM_PROVIDER:-ollama}
      - EDGEQUAKE_EMBEDDING_PROVIDER=${EDGEQUAKE_EMBEDDING_PROVIDER:-}
      # Vision extraction timeout (seconds). Default 600s (10 min).
      - EDGEQUAKE_VISION_TIMEOUT_SECS=${EDGEQUAKE_VISION_TIMEOUT_SECS:-600}
      # pdfium-auto cache dir — writable by the non-root container user.
      # Override with PDFIUM_AUTO_CACHE_DIR if you mount a persistent volume.
      - PDFIUM_AUTO_CACHE_DIR=${PDFIUM_AUTO_CACHE_DIR:-/tmp/edgequake-pdfium-cache}
      - RUST_LOG=${RUST_LOG:-edgequake=info,edgequake_api=info,edgequake_query=warn,edgequake_pipeline=info,edgequake_storage=warn,tower_http=warn,sqlx=warn}
      - EDGEQUAKE_LOG_FORMAT=${EDGEQUAKE_LOG_FORMAT:-plain}
      - EDGEQUAKE_LOG_SPAN_EVENTS=${EDGEQUAKE_LOG_SPAN_EVENTS:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-edgequake-api}
      - EDGEQUAKE_OTEL_ENABLED=${EDGEQUAKE_OTEL_ENABLED:-}
      # SPEC-124 Langfuse (OTLP/HTTP) — pass host env into the API container
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - EDGEQUAKE_LANGFUSE_ENABLED=${EDGEQUAKE_LANGFUSE_ENABLED:-}
      - EDGEQUAKE_LANGFUSE_API=${EDGEQUAKE_LANGFUSE_API:-}
      # SPEC-006 resource safety (see specifications/006-ensure-perf/009_operator_runbook.md)
      - WORKER_THREADS=${WORKER_THREADS:-8}
      - MAX_TASKS_PER_TENANT=${MAX_TASKS_PER_TENANT:-6}
      - EDGEQUAKE_MAX_CONCURRENT_EXTRACTIONS=${EDGEQUAKE_MAX_CONCURRENT_EXTRACTIONS:-4}
      - EDGEQUAKE_GRAPH_SCAN_THRESHOLD=${EDGEQUAKE_GRAPH_SCAN_THRESHOLD:-50000}
      - EDGEQUAKE_GRAPH_MATERIALIZE_CONCURRENT=${EDGEQUAKE_GRAPH_MATERIALIZE_CONCURRENT:-1}
      - EDGEQUAKE_GRAPH_QUERY_TIMEOUT_SECS=${EDGEQUAKE_GRAPH_QUERY_TIMEOUT_SECS:-15}
      - EDGEQUAKE_MAX_UPLOAD_BYTES=${EDGEQUAKE_MAX_UPLOAD_BYTES:-52428800}
    # Linux only: enable host.docker.internal resolution
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edgequake-network
    healthcheck:
      test: ["CMD", "edgequake", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # EdgeQuake Frontend (Next.js)
  frontend:
    build:
      context: ../../
      dockerfile: edgequake_webui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: edgequake-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=production
    depends_on:
      - edgequake
    networks:
      - edgequake-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL with pgvector and Apache AGE extensions (SPEC-042 triple-track)
  # Default profile: PG18 (EQ_POSTGRES_PROFILE=pg18). Legacy: EQ_POSTGRES_PROFILE=pg16|pg17
  postgres:
    build:
      context: .
      dockerfile: ${EQ_POSTGRES_DOCKERFILE:-Dockerfile.postgres.pg18}
    container_name: edgequake-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=edgequake
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edgequake_secret}
      - POSTGRES_DB=edgequake
    volumes:
      - ${POSTGRES_VOLUME_NAME:-postgres-data-pg18}:${POSTGRES_DATA_DIR:-/var/lib/postgresql}
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - edgequake-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgequake -d edgequake"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # SPEC-172: local originals bucket. Single-node MinIO reports parity 0.
  # This is a development store, not a production volume. Image user is 65532.
  # The image has no shell and no curl, so readiness is EdgeQuake /ready, not an
  # in-container healthcheck. Bucket creation is the minio-client one-shot.
  # Do not set MINIO_DOMAIN; the SDK uses path-style against this endpoint.
  minio:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio:latest
    container_name: edgequake-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    networks:
      - edgequake-network

  minio-init:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    container_name: edgequake-minio-init
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@host.docker.internal:${MINIO_API_PORT:-9000}
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-eq-originals}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edgequake-network
    restart: "no"

  # The client image is mc itself, with no shell, so each admin call is its own
  # one-shot. Root creates the policy and the app user. The API does not use root.
  minio-policy:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@host.docker.internal:${MINIO_API_PORT:-9000}
    volumes:
      - ./minio/originals-policy.json:/policy/originals-policy.json:ro
    command: ["admin", "policy", "create", "local", "originals-app", "/policy/originals-policy.json"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edgequake-network
    restart: "no"

  minio-policy-info:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@host.docker.internal:${MINIO_API_PORT:-9000}
    command: ["admin", "policy", "info", "local", "originals-app"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edgequake-network
    restart: "no"

  minio-user:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@host.docker.internal:${MINIO_API_PORT:-9000}
    command: ["admin", "user", "add", "local", "${MINIO_APP_USER:-eq-originals-app}", "${MINIO_APP_PASSWORD:-eq-originals-app-dev}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edgequake-network
    restart: "no"

  minio-user-info:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@host.docker.internal:${MINIO_API_PORT:-9000}
    command: ["admin", "user", "info", "local", "${MINIO_APP_USER:-eq-originals-app}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edgequake-network
    restart: "no"

  minio-attach:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@host.docker.internal:${MINIO_API_PORT:-9000}
    command: ["admin", "policy", "attach", "local", "originals-app", "--user", "${MINIO_APP_USER:-eq-originals-app}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edgequake-network
    restart: "no"

  minio-canary:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@host.docker.internal:${MINIO_API_PORT:-9000}
    volumes:
      - ./minio/canary.txt:/policy/canary.txt:ro
    command: ["cp", "/policy/canary.txt", "local/${MINIO_BUCKET:-eq-originals}/other/policy-canary"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edgequake-network
    restart: "no"

  # MinIO ignores AbortIncompleteMultipartUpload. Stale parts expire through this
  # server setting. The AWS file is for an operator; this process does not apply it.
  minio-config-get:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@host.docker.internal:${MINIO_API_PORT:-9000}
    command: ["admin", "config", "get", "local", "api"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edgequake-network
    restart: "no"

  minio-config-set:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@host.docker.internal:${MINIO_API_PORT:-9000}
    command: ["admin", "config", "set", "local", "api", "stale_uploads_expiry=24h"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edgequake-network
    restart: "no"

  # Optional: Jaeger all-in-one for OTLP trace export (SPEC-018).
  # Usage: docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: edgequake-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTEL_GRPC_PORT:-4317}:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - edgequake-network

volumes:
  # Per-major volumes — PG18+ uses /var/lib/postgresql mount (official image PR #1259)
  postgres-data-pg18:
    driver: local
  postgres-data-pg17:
    driver: local
  postgres-data-pg16:
    driver: local
  # SPEC-172 dev object store. Named volume so the Chainguard user 65532 can write it.
  minio-data:
    driver: local

networks:
  edgequake-network:
    driver: bridge
