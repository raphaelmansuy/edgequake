name: Test Quality Gates

# First principles: do NOT recompile the full workspace lib suite here —
# that already runs in CI (`test` job). This workflow owns complementary
# gates: invariants, count floor, flake lint, UI-only Playwright.

on:
  push:
    branches: [main, edgequake-main]
  pull_request:
    branches: [main, edgequake-main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUST_TOOLCHAIN: 1.95.0
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_LOG: warn
  RUST_MIN_STACK: "16777216"

jobs:
  invariant-tests:
    name: Invariant Tests (INV-001 to INV-010)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: invariants
          save-if: ${{ github.ref == 'refs/heads/edgequake-main' || github.ref == 'refs/heads/main' }}

      - name: Run invariant tests
        working-directory: edgequake
        run: |
          set -euo pipefail
          echo "Running critical invariant tests..."
          cargo test --package edgequake-core --test inviolable_invariants --locked --no-fail-fast 2>&1 | tee invariant_output.txt
          cargo test --package edgequake-core --test edge_case_invariants --locked --no-fail-fast 2>&1 | tee -a invariant_output.txt
          cargo test --package edgequake-api --test integration_invariants --locked --no-fail-fast 2>&1 | tee -a invariant_output.txt
          if grep -q "FAILED" invariant_output.txt; then
            echo "::error::CRITICAL: Invariant tests failed! This is a reliability violation."
            exit 1
          fi
          echo "::notice::All invariant tests passed - reliability verified"

  test-count-gate:
    name: Test Count Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: test-count
          save-if: ${{ github.ref == 'refs/heads/edgequake-main' || github.ref == 'refs/heads/main' }}

      - name: Verify minimum test count (lib, no-default-features)
        working-directory: edgequake
        run: |
          set -euo pipefail
          # Feature-matrix floor only (CI `test` already covers default features).
          cargo test --workspace --lib --no-default-features --locked --no-fail-fast 2>&1 | tee all_tests.txt
          TOTAL_PASSED=$(grep "test result:" all_tests.txt | grep -oE "[0-9]+ passed" | awk '{sum += $1} END {print sum}')
          echo "::notice::Total tests passed: ${TOTAL_PASSED}"
          MIN_TESTS=870
          if [ "${TOTAL_PASSED:-0}" -lt "$MIN_TESTS" ]; then
            echo "::error::Test count below threshold! Expected >= ${MIN_TESTS}, got ${TOTAL_PASSED}"
            exit 1
          fi
          echo "✅ Test count gate passed: ${TOTAL_PASSED} >= ${MIN_TESTS}"

  e2e-flake-lint:
    name: E2E Flake Lint (chromium gate)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Validate chromium gate anti-patterns
        run: make test-e2e-lint

  e2e-ui:
    name: E2E UI Gate (chromium, no backend)
    runs-on: ubuntu-latest
    # Suite has grown (~500+ chromium tests); 25m was canceling mid-run on GHA.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: edgequake_webui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: edgequake_webui
        run: pnpm exec playwright install chromium --with-deps

      - name: Run UI-only chromium gate
        run: make test-e2e-ui

  quality-summary:
    name: Quality Gate Summary
    needs: [invariant-tests, test-count-gate, e2e-flake-lint, e2e-ui]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check quality gates
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Invariant Tests | ${{ needs.invariant-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Count (>=870) | ${{ needs.test-count-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Flake Lint | ${{ needs.e2e-flake-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E UI Gate | ${{ needs.e2e-ui.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workspace lib suite lives in **CI → Test** (not duplicated here)." >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.invariant-tests.result }}" == "failure" ]; then
            echo "::error::CRITICAL: Invariant tests failed - reliability violation!"
            exit 1
          fi
          if [ "${{ needs.test-count-gate.result }}" == "failure" ]; then
            echo "::error::Test count gate failed"
            exit 1
          fi
          if [ "${{ needs.e2e-flake-lint.result }}" == "failure" ]; then
            echo "::error::E2E flake lint failed — fix anti-patterns in chromium gate specs"
            exit 1
          fi
          if [ "${{ needs.e2e-ui.result }}" == "failure" ]; then
            echo "::error::E2E UI gate failed — run make test-e2e-ui locally"
            exit 1
          fi
