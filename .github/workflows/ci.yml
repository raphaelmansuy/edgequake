name: CI

# First principles for speed:
# 1. Fail cheap first (migration checksum — no Rust compile).
# 2. One shared cargo cache across jobs (shared-key) — avoid N× cold compiles.
# 3. No incremental / sparse index / locked — CI is from-scratch friendly.
# 4. Do not re-run the same lib suite in sibling workflows (see Test Quality Gates).
# 5. Cancel superseded runs immediately.

on:
  push:
    branches: [main, edgequake-main, "feat/**"]
  pull_request:
    branches: [main, edgequake-main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUST_TOOLCHAIN: 1.95.0
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_LOG: warn
  # v0.4.0: pdfium is embedded via pdfium-auto — no external library on CI.

jobs:
  migration-checksum-guard:
    name: Migration checksum guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify migration checksums against lockfile
        run: |
          chmod +x scripts/check_migration_checksums.sh
          ./scripts/check_migration_checksums.sh --verbose

  git-hygiene:
    name: Git hygiene (SPEC-097)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Block fat bench artifacts / oversized tip blobs
        run: |
          chmod +x tools/git-hygiene/check_no_fat_artifacts.sh
          ./tools/git-hygiene/check_no_fat_artifacts.sh

  deploy-script-guards:
    name: Deploy script guards (irreversible consent)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # Issue #537: deploy.sh must never run `migrate --drop-age` on its own.
      - name: AGE drop consent gate
        run: |
          chmod +x deploy/gcp/scripts/tests/age_drop_consent.sh
          ./deploy/gcp/scripts/tests/age_drop_consent.sh

  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migration-checksum-guard, git-hygiene]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          cache-key: check
          save-if: ${{ github.ref == 'refs/heads/edgequake-main' || github.ref == 'refs/heads/main' }}

      - name: Check formatting
        working-directory: edgequake
        run: cargo fmt --all -- --check

      - name: Check clippy
        working-directory: edgequake
        # SPEC-083 / X-32: prefer --all-targets (lib + bins + tests + examples).
        # Falls back documented: if runner time regresses, keep at least beyond --lib.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (workspace lib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: migration-checksum-guard
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: test
          save-if: ${{ github.ref == 'refs/heads/edgequake-main' || github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run workspace lib tests
        working-directory: edgequake
        # nextest: faster scheduling than cargo test; --locked: no registry resolve churn.
        # Cap threads + raise stack: edgequake-api query handler tests are deep/async and
        # SIGABRT under default nextest parallelism on small runners.
        run: cargo nextest run --workspace --lib --locked --no-fail-fast --test-threads=4
        env:
          RUST_MIN_STACK: "16777216"

      - name: SPEC-126 prompt-cache e2e
        working-directory: edgequake
        run: cargo nextest run -p edgequake-api --test e2e_spec126_prompt_cache --locked --test-threads=1

  resource-proof:
    name: SPEC-006 Resource Proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: migration-checksum-guard
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: resource-proof
          save-if: ${{ github.ref == 'refs/heads/edgequake-main' || github.ref == 'refs/heads/main' }}

      - name: Install ripgrep (static gate scripts)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run SPEC-006 resource-proof (P0–P9)
        env:
          DATABASE_URL: ""
          POSTGRES_PASSWORD: ""
        run: make resource-proof

  observability-proof:
    name: SPEC-018 Observability Proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: migration-checksum-guard
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: observability
          save-if: ${{ github.ref == 'refs/heads/edgequake-main' || github.ref == 'refs/heads/main' }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: edgequake_webui
        run: bun install

      - name: Run SPEC-018 observability proof
        run: |
          chmod +x specs/018-observability/e2e/run_observability_proof.sh
          ./specs/018-observability/e2e/run_observability_proof.sh

  build:
    name: Build (release libs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: migration-checksum-guard
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: build-release
          save-if: ${{ github.ref == 'refs/heads/edgequake-main' || github.ref == 'refs/heads/main' }}

      - name: Build release
        working-directory: edgequake
        run: cargo build --workspace --release --lib --locked
        env:
          # Prefer parallel codegen on small runners; LTO is for publish images.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # Runs before setup-rust: it is a text check on the workflow and the
      # policy doc, so a missing justification fails in seconds instead of
      # after a toolchain install.
      - name: Every audit ignore is justified
        run: |
          chmod +x scripts/check_audit_ignores.sh
          ./scripts/check_audit_ignores.sh
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: audit
          shared-key: edgequake-audit
          save-if: "false"

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        working-directory: edgequake
        # SPEC-083 / X-32: audit is a blocking gate (no continue-on-error).
        # cargo-audit 0.22 has no config file, so the policy lives in this flag
        # list. Each id is justified in docs/security/dependency-remediation-2026-11.md;
        # an advisory not listed here fails the gate and needs a human.
        #
        # Not reachable from our code:
        #   2026-0429 zip ZipArchive::extract symlink abort. edgeparse-core 0.3.2
        #     uses only zip::write::ZipWriter (verified in its source);
        #     utoipa-swagger-ui 9 opens ZipArchive only in its build script, over
        #     the Swagger UI archive it fetches, never over uploaded bytes. DOCX
        #     and ZIP uploads are rejected by file_validation.rs.
        #   2026-0459 libsqlite3-sys CVE. Reached only through the optional
        #     `sqlite` feature; the shipped image builds --features "postgres,vision"
        #     and its graph contains no sqlite crate. sqlx-sqlite pins ^0.30, so
        #     the 0.39 fix requires sqlx 0.9 across the workspace.
        # No fix exists for the selected version:
        #   2026-0367 / 0368 / 0369  zip, patched only in 9.x, which neither
        #     parent can select.
        #   2023-0071  rsa Marvin attack, no fixed release.
        #   2026-0387  crypto-bigint 0.5.5, pinned by elliptic-curve 0.13 via
        #     p256, required by openidconnect 4.0.1.
        #   2026-0173  proc-macro-error2, no fixed release.
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0387 \
            --ignore RUSTSEC-2026-0429 \
            --ignore RUSTSEC-2026-0459

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migration-checksum-guard
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: docs
          save-if: ${{ github.ref == 'refs/heads/edgequake-main' || github.ref == 'refs/heads/main' }}

      - name: Build docs
        working-directory: edgequake
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -A rustdoc::broken_intra_doc_links -D warnings
