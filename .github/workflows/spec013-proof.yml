# SPEC-013 proof gate — manual / nightly only (live Mistral + Postgres required).
# Does not run on every push: needs MISTRAL_API_KEY secret and long runtime.

name: SPEC-013 Proof

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: spec013-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  SPEC013_CARGO_TEST_ARGS: --test-threads=1

jobs:
  spec013-proof:
    name: SPEC-013 deterministic proof (3×)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edgequake
          POSTGRES_PASSWORD: edgequake_secret
          POSTGRES_DB: edgequake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgequake -d edgequake"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Require MISTRAL_API_KEY
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::warning::MISTRAL_API_KEY not configured — skipping nightly Mistral proof."
            echo "Add repository secret MISTRAL_API_KEY (Settings → Secrets → Actions)."
            echo "PRs still run spec013-proof-pr.yml (mock + storage)."
            echo "SKIP_SPEC013_PROOF=1" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        if: env.SKIP_SPEC013_PROOF != '1'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        if: env.SKIP_SPEC013_PROOF != '1'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edgequake

      - name: Wait for PostgreSQL
        if: env.SKIP_SPEC013_PROOF != '1'
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U edgequake -d edgequake && exit 0
            sleep 2
          done
          exit 1

      - name: Run SPEC-013 proof (3×)
        if: env.SKIP_SPEC013_PROOF != '1'
        env:
          DATABASE_URL: postgresql://edgequake:edgequake_secret@localhost:5432/edgequake
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SPEC013_PROOF_REPEAT: "3"
        run: make spec013-proof-ci
