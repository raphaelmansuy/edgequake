# SPEC-013 proof gate — manual / nightly only (live Mistral + Postgres required).
# Does not run on every push: needs MISTRAL_API_KEY secret and long runtime.

name: SPEC-013 Proof

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: spec013-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  SPEC013_CARGO_TEST_ARGS: --test-threads=1

jobs:
  secret-missing:
    name: MISTRAL_API_KEY not configured (skipped)
    runs-on: ubuntu-latest
    if: ${{ secrets.MISTRAL_API_KEY == '' }}
    steps:
      - name: Explain skip
        run: |
          echo "::warning::Nightly SPEC-013 Mistral proof skipped."
          echo "Add repository secret MISTRAL_API_KEY (Settings → Secrets → Actions)."
          echo "PRs still run .github/workflows/spec013-proof-pr.yml (mock + storage)."

  spec013-proof:
    name: SPEC-013 deterministic proof (3×)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ secrets.MISTRAL_API_KEY != '' }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edgequake
          POSTGRES_PASSWORD: edgequake_secret
          POSTGRES_DB: edgequake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgequake -d edgequake"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edgequake

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U edgequake -d edgequake && exit 0
            sleep 2
          done
          exit 1

      - name: Run SPEC-013 proof (3×)
        env:
          DATABASE_URL: postgresql://edgequake:edgequake_secret@localhost:5432/edgequake
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SPEC013_PROOF_REPEAT: "3"
        run: make spec013-proof-ci
