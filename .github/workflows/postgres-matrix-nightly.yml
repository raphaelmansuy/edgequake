name: PostgreSQL Matrix Nightly (OPS-17)

# SPEC-046 OPS-P2.17 — multi-major pin smoke + optional battle.
# Default job is non-flaky (no Docker DB required): validates extension-pins.sh.
# Full battle suite runs on schedule / workflow_dispatch with battle=true.

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      battle:
        description: "Run SPEC-042 Docker battle tests for all profiles"
        required: false
        default: false
        type: boolean

concurrency:
  group: ops17-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OPS-17 pin smoke (pg16/pg17/pg18)
        run: bash specs/046-graphrag-study/e2e/run_ops17_perf_smoke.sh

  # SPEC-054 wiring contracts (no Docker DB) — always on nightly.
  spec054-contracts:
    runs-on: ubuntu-latest
    needs: pin-smoke
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edgequake
      - name: Spec 054 query/postgres contracts
        working-directory: edgequake
        run: |
          cargo test -p edgequake-storage --test contract_spec054_query_postgres_perf -- --nocapture
          cargo test -p edgequake-storage --lib adapters::postgres::vector::search_tuning -- --nocapture

  # SPEC-060: FORBIDDEN / native-writes contracts (no Docker DB).
  spec060-contracts:
    runs-on: ubuntu-latest
    needs: pin-smoke
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edgequake
      - name: Spec 060 complexity contracts
        working-directory: edgequake
        run: |
          set -euo pipefail
          cargo test -p edgequake-storage --test contract_spec060_forbidden_request_path -- --nocapture
          cargo test -p edgequake-storage --test contract_spec060_native_writes -- --nocapture
          cargo test -p edgequake-query --test e2e_spec060_query_arm_wall_perf -- --nocapture
          cargo test -p edgequake-query --test e2e_spec059_arm_concurrency_load -- --nocapture

  # SPEC-061: inviolable DataAccess p95/EXPLAIN/stress × PG16/17/18.
  # Soft-skip impossible: EDGEQUAKE_REQUIRE_POSTGRES_TESTS=1; images built before run.
  spec061-data-access-perf:
    if: ${{ github.event_name == 'schedule' || inputs.battle == true }}
    runs-on: ubuntu-latest
    needs: [pin-smoke, spec054-contracts, spec060-contracts]
    strategy:
      fail-fast: false
      matrix:
        profile: [pg16, pg17, pg18]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edgequake
      - name: Build Postgres image ${{ matrix.profile }}
        run: |
          set -euo pipefail
          case "${{ matrix.profile }}" in
            pg16) make postgres-image-build ;;
            pg17) make postgres-image-build-pg17 ;;
            pg18) make postgres-image-build-pg18 ;;
          esac
      # Native graph helpers (eq_next_node_id) require sqlx migrations on ephemeral DBs.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked
      - name: DataAccess perf matrix ${{ matrix.profile }}
        env:
          EQ_POSTGRES_PROFILE: ${{ matrix.profile }}
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
          EDGEQUAKE_NATIVE_GRAPH_WRITES: "1"
        run: |
          set -euo pipefail
          chmod +x specs/061-multi-version-data-access-perf/e2e/run_data_access_perf_matrix.sh
          ./specs/061-multi-version-data-access-perf/e2e/run_data_access_perf_matrix.sh "${{ matrix.profile }}"
      - name: Upload perf JSONL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eq-perf-${{ matrix.profile }}
          path: /tmp/eq-perf-${{ matrix.profile }}*.jsonl
          if-no-files-found: warn

  # Legacy aliases — SPEC-061 is the SSOT multi-major perf gate.
  spec060-postgres-perf:
    if: ${{ github.event_name == 'schedule' || inputs.battle == true }}
    runs-on: ubuntu-latest
    needs: [spec061-data-access-perf]
    steps:
      - name: Alias — covered by spec061-data-access-perf
        run: echo "spec060-postgres-perf succeeded via spec061-data-access-perf"

  spec054-postgres-perf:
    if: ${{ github.event_name == 'schedule' || inputs.battle == true }}
    runs-on: ubuntu-latest
    needs: [spec061-data-access-perf]
    steps:
      - name: Alias — covered by spec061-data-access-perf
        run: echo "spec054-postgres-perf succeeded via spec061-data-access-perf"

  # Capability battle (features exist) — separate from SLO matrix; builds images first.
  battle-matrix:
    if: ${{ github.event_name == 'schedule' || inputs.battle == true }}
    runs-on: ubuntu-latest
    needs: pin-smoke
    strategy:
      fail-fast: false
      matrix:
        profile: [pg16, pg17, pg18]
    steps:
      - uses: actions/checkout@v7
      - name: Build image ${{ matrix.profile }}
        run: |
          set -euo pipefail
          case "${{ matrix.profile }}" in
            pg16) make postgres-image-build ;;
            pg17) make postgres-image-build-pg17 ;;
            pg18) make postgres-image-build-pg18 ;;
          esac
      - name: Battle test ${{ matrix.profile }}
        env:
          EQ_POSTGRES_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          specs/042-update-age-pgvector/e2e/run_version_feature_battle_test.sh "${{ matrix.profile }}"
