# SPEC-083 D-48 — root-owned SDK CI.
# Nested sdks/*/.github/workflows are ignored by GitHub Actions; this workflow
# is the executable SSOT. Nested YAML files remain as references / local docs.
name: SDK CI

on:
  push:
    branches: [main, "feat/*"]
    paths:
      - "sdks/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/**"
      - ".github/workflows/sdk-ci.yml"
  workflow_dispatch:

jobs:
  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -m "not integration and not e2e" -q --tb=short

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib --tests
      - run: cargo build --release
