# Root-owned SDK publish. Nested sdks/*/.github/workflows are ignored by GitHub Actions.
# Dispatch this workflow to publish the three registry clients. A version that is
# already on the registry is left in place.
name: SDK Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-python:
    name: Test Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -m "not integration and not e2e" -q --tb=short

  test-typescript:
    name: Test TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  test-rust:
    name: Test Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - run: cargo test --locked --lib --tests

  publish-python:
    name: Publish Python SDK
    needs: test-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: pip install build && python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-typescript:
    name: Publish TypeScript SDK
    needs: test-typescript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Publish to npm when this version is absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set. npm edgequake-sdk is unchanged."
            exit 1
          fi
          local_version=$(node -p "require('./package.json').version")
          remote_version=$(npm view edgequake-sdk version)
          if [ "$local_version" = "$remote_version" ]; then
            echo "npm already has edgequake-sdk@$local_version"
            exit 0
          fi
          npm publish --access public --provenance

  publish-rust:
    name: Publish Rust SDK
    needs: test-rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io when this version is absent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set."
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A 'edgequake-sdk-publish' \
            "https://crates.io/api/v1/crates/edgequake-sdk/${version}")
          if [ "$code" = "200" ]; then
            echo "crates.io already has edgequake-sdk@$version"
            exit 0
          fi
          cargo publish --locked
