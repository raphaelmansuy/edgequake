name: PostgreSQL Integration Tests

on:
  push:
    branches: [main, edgequake-main]
    paths:
      - "edgequake/crates/edgequake-storage/**"
      - "edgequake/crates/edgequake-api/**"
      - "edgequake/crates/edgequake-core/**"
      - "edgequake/crates/edgequake-tasks/**"
      - "edgequake/migrations/**"
      - ".github/workflows/postgres-integration.yml"
      - "scripts/compare_eq_perf_jsonl.py"
      - "scripts/tests/test_compare_eq_perf_jsonl.py"
      - "scripts/annotate_query_timings.py"
      - "scripts/tests/test_annotate_query_timings.py"
  pull_request:
    branches: [main, edgequake-main]
    paths:
      - "edgequake/crates/edgequake-storage/**"
      - "edgequake/crates/edgequake-api/**"
      - "edgequake/crates/edgequake-core/**"
      - "edgequake/crates/edgequake-tasks/**"
      - "edgequake/migrations/**"
      - ".github/workflows/postgres-integration.yml"
      - "scripts/compare_eq_perf_jsonl.py"
      - "scripts/tests/test_compare_eq_perf_jsonl.py"
      - "scripts/annotate_query_timings.py"
      - "scripts/tests/test_annotate_query_timings.py"
  # Allow manual trigger for full integration test suite
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: "Run all integration tests (not just changed modules)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.95.0
  # PostgreSQL connection settings
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_DB: edgequake_test
  POSTGRES_USER: edgequake_test
  POSTGRES_PASSWORD: test_password_123
  DATABASE_URL: postgresql://edgequake_test:test_password_123@localhost:5432/edgequake_test
  TEST_DATABASE_URL: postgresql://app_user:app_password_123@localhost:5432/edgequake_test
  ADMIN_DATABASE_URL: postgresql://edgequake_test:test_password_123@localhost:5432/edgequake_test

jobs:
  postgres-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # SPEC-091 IW0 (GAP-091-27): re-enabled on the GHCR AGE image — the original
    # disable reason ("missing AGE extension") no longer exists. Do NOT set
    # continue-on-error on RLS / workspace / task gates — those must block.

    services:
      postgres:
        image: ghcr.io/raphaelmansuy/edgequake-postgres:latest
        env:
          POSTGRES_DB: edgequake_test
          POSTGRES_USER: edgequake_test
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_HOST_AUTH_METHOD: md5
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgequake_test -d edgequake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 60s

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edgequake
          key: postgres-integration

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U edgequake_test -d edgequake_test; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i: PostgreSQL not ready yet..."
            sleep 2
          done

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup database schema and extensions
        run: |
          echo "Setting up test database..."

          # Install pgvector + AGE extensions (GHCR image ships both; SPEC-091 IW0)
          PGPASSWORD=test_password_123 psql -h localhost -p 5432 -U edgequake_test -d edgequake_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=test_password_123 psql -h localhost -p 5432 -U edgequake_test -d edgequake_test -c "CREATE EXTENSION IF NOT EXISTS age;"

          # Create app_user for RLS testing (non-superuser)
          PGPASSWORD=test_password_123 psql -h localhost -p 5432 -U edgequake_test -d edgequake_test << 'EOSQL'
            -- Create application user (non-superuser) for RLS testing
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN
                CREATE ROLE app_user WITH LOGIN PASSWORD 'app_password_123';
              END IF;
            END $$;
            
            -- Grant necessary permissions
            GRANT CONNECT ON DATABASE edgequake_test TO app_user;
            GRANT USAGE ON SCHEMA public TO app_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user;
          EOSQL

          echo "Database setup complete!"

      - name: Run database migrations
        working-directory: edgequake
        run: |
          echo "Running database migrations via sqlx (fail closed)…"
          export DATABASE_URL="postgres://edgequake_test:test_password_123@localhost:5432/edgequake_test"
          # Prefer sqlx migrate run (checksum-faithful). Fall back to ordered psql without || true.
          if command -v sqlx >/dev/null; then
            sqlx migrate run --source migrations
          else
            for file in $(ls migrations/[0-9]*.sql | sort); do
              echo "Applying migration: $file"
              PGPASSWORD=test_password_123 psql -h localhost -p 5432 -U edgequake_test -d edgequake_test -v ON_ERROR_STOP=1 -f "$file"
            done
          fi
          echo "Migrations complete!"

      - name: Verify performance evidence gates
        run: |
          python3 -m unittest discover -s scripts/tests -p test_compare_eq_perf_jsonl.py -v
          python3 -m unittest discover -s scripts/tests -p test_annotate_query_timings.py -v

      - name: Run data-access fault and measurement gates
        working-directory: edgequake
        env:
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
        run: |
          set -euo pipefail
          export EQ_POSTGRES_MAJOR="$(psql "$DATABASE_URL" -XAtc "SELECT current_setting('server_version_num')::integer / 10000")"
          export EQ_POSTGRES_PROFILE="pg${EQ_POSTGRES_MAJOR}"
          cargo test -p edgequake-storage --features postgres \
            --test performance_harness_contract -- --test-threads=1
          cargo test -p edgequake-storage --features postgres \
            --test postgres_access_reliability \
            --test postgres_ann_measurement \
            --test postgres_typed_ann_measurement \
            --test e2e_spec090_multi_pool \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/postgres-access-reliability.log
          sed -n 's/^.*PERF_REPORT //p' /tmp/postgres-access-reliability.log > /tmp/postgres-access-reliability.jsonl

      - name: Archive data-access measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-access-reliability
          path: |
            /tmp/postgres-access-reliability.log
            /tmp/postgres-access-reliability.jsonl
          if-no-files-found: warn

      - name: Verify source query catalog and execution regressions
        working-directory: edgequake
        env:
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
          EQ_QUERY_AUDIT_OUTPUT: /tmp/postgres-query-catalog.json
          EQ_QUERY_EXECUTION_LOG: /tmp/postgres-query-execution.jsonl
        run: |
          set -euo pipefail
          cargo test -p edgequake-storage --features postgres --test postgres_query_catalog --test postgres_pdf_query_contract -- --test-threads=1 --nocapture
          cargo test -p edgequake-api --features postgres \
            --test postgres_query_regressions \
            --test contract_spec091_checkpoint_typed_write_stop \
            --test contract_spec091_cqrs_batch_sink \
            -- --test-threads=1
          cargo test -p edgequake-api --features postgres --test postgres_index_plans \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/postgres-index-plans.log
          sed -n 's/^.*INDEX_PLAN_REPORT //p' /tmp/postgres-index-plans.log > /tmp/postgres-index-plans.jsonl
          python3 ../scripts/annotate_query_timings.py /tmp/postgres-query-catalog.json /tmp/postgres-query-execution.jsonl --output /tmp/postgres-query-timings.json

      - name: Archive source query verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-query-catalog
          path: |
            /tmp/postgres-query-catalog.json
            /tmp/postgres-query-execution.jsonl
            /tmp/postgres-query-timings.json
            /tmp/postgres-index-plans.log
            /tmp/postgres-index-plans.jsonl
          if-no-files-found: warn

      - name: Verify independently injected DAL providers
        working-directory: edgequake
        env:
          EDGEQUAKE_PROVIDER_ACCESS_E2E: "1"
          EDGEQUAKE_REQUIRE_PROVIDER_ACCESS: "1"
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
          EQ_DAL_PROVIDER_REPORT: /tmp/dal-provider-composition.json
          EQ_PROJECTION_PROVIDER_PLAN_OUTPUT: /tmp/dal-provider-plans.json
        run: |
          set -euo pipefail
          cargo test -p edgequake-api --features postgres --test e2e_dal_provider_composition \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/dal-provider-composition.log
          cargo test -p edgequake-storage --features postgres --test postgres_projection_provider_plans \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/dal-provider-plans.log

      - name: Require real tenant authorization and non-bypass RLS
        working-directory: edgequake
        env:
          EDGEQUAKE_PROVIDER_ACCESS_E2E: "1"
          EDGEQUAKE_REQUIRE_PROVIDER_ACCESS: "1"
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
          EQ_TENANT_RLS_REPORT: /tmp/tenant-rls.json
          EQ_TENANT_HTTP_REPORT: /tmp/tenant-http.json
          EQ_TENANT_CATALOG_REPORT: /tmp/tenant-catalog.json
        run: |
          set -euo pipefail
          cargo test -p edgequake-api --features postgres \
            --test e2e_tenant_authorization --test e2e_tenant_rls \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/tenant-security.log
          test -s /tmp/tenant-rls.json
          test -s /tmp/tenant-http.json
          test -s /tmp/tenant-catalog.json

      - name: Archive tenant security measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-security
          path: |
            /tmp/tenant-rls.json
            /tmp/tenant-http.json
            /tmp/tenant-catalog.json
            /tmp/tenant-security.log

      - name: Archive DAL provider composition measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dal-provider-composition
          path: |
            /tmp/dal-provider-composition.json
            /tmp/dal-provider-composition.log
            /tmp/dal-provider-plans.json
            /tmp/dal-provider-plans.log
          if-no-files-found: warn

      - name: Run SPEC-149 provider-access projection tests
        working-directory: edgequake
        env:
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
          DATABASE_URL: postgres://edgequake_test:test_password_123@localhost:5432/edgequake_test
        run: |
          cargo test --package edgequake-storage --features postgres \
            --test e2e_spec149_projection_replay \
            --test e2e_spec149_ingestion_committer \
            -- --test-threads=1

      - name: Run SPEC-091 serving fence open e2e
        working-directory: edgequake
        env:
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
          DATABASE_URL: postgres://edgequake_test:test_password_123@localhost:5432/edgequake_test
        run: |
          cargo test --package edgequake-storage --features postgres \
            --test e2e_spec091_serving_fence_open \
            -- --test-threads=1
          cargo test --package edgequake-storage --features postgres,provider-access-fault \
            --test e2e_spec149_process_kill \
            -- --test-threads=1

      - name: Grant permissions to app_user
        run: |
          PGPASSWORD=test_password_123 psql -h localhost -p 5432 -U edgequake_test -d edgequake_test << 'EOSQL'
            -- Grant permissions on all tables to app_user
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
            GRANT edgequake_tenant_access TO app_user;
          EOSQL

      - name: Run PostgreSQL Storage Integration Tests
        working-directory: edgequake
        run: |
          echo "Running PostgreSQL storage integration tests..."
          cargo test --package edgequake-storage --test postgres_integration --features postgres -- --test-threads=1
        # SPEC-083 / X-32: optional quarantine — pgvector-only image lacks AGE;
        # AGE coverage is blocking in postgres-age-tests.
        continue-on-error: true

      - name: Run PostgreSQL Conversation Integration Tests
        working-directory: edgequake
        run: |
          echo "Running PostgreSQL conversation integration tests..."
          cargo test --package edgequake-storage --test postgres_conversation_integration --features postgres -- --test-threads=1

      - name: Run PostgreSQL RLS E2E Tests
        working-directory: edgequake
        run: |
          echo "Running PostgreSQL RLS E2E tests..."
          # SPEC-091 IW0 (GAP-091-27): suite is un-ignored (soft-skips without the rig);
          # here the rig exists so all 11 tests execute for real.
          cargo test --package edgequake-api --test e2e_postgres_rls --features postgres -- --test-threads=1
        # SPEC-083 / X-32: RLS is a required gate (no continue-on-error).

      - name: Run PostgreSQL Workspace Service Tests
        working-directory: edgequake
        run: |
          echo "Running PostgreSQL workspace service tests..."
          cargo test --package edgequake-api --test e2e_postgres_workspace --features postgres -- --test-threads=1

      - name: Run PostgreSQL Task Storage Tests
        working-directory: edgequake
        run: |
          echo "Running PostgreSQL task storage tests..."
          cargo test --package edgequake-tasks --features postgres -- --test-threads=1

      - name: Run SPEC-129 touch-status CHECK e2e (#381)
        working-directory: edgequake
        env:
          DATABASE_URL: postgresql://edgequake_test:test_password_123@localhost:5432/edgequake_test
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
        run: |
          echo "Running SPEC-129 / #381 CHECK-safe document status proof..."
          cargo test -p edgequake-api --features postgres --test e2e_spec129_touch_status_check -- --test-threads=1
          cargo test -p edgequake-api --features postgres --lib update_document_status_re_embedding_projects_processing_column -- --test-threads=1

      - name: Run SPEC-136 durable lid stamp-UPDATE absorb (#377)
        working-directory: edgequake
        env:
          DATABASE_URL: postgresql://edgequake_test:test_password_123@localhost:5432/edgequake_test
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
        run: |
          echo "Running SPEC-136 / #377 durable NULL-lid stamp-UPDATE absorb proof..."
          cargo test -p edgequake-storage --features postgres --test contract_spec120_legacy_vector_id_race -- --test-threads=1
          cargo test -p edgequake-api --features postgres --test e2e_spec136_durable_lid_retry -- --test-threads=1

      - name: Run SPEC-154 security hardening e2e
        working-directory: edgequake
        env:
          DATABASE_URL: postgresql://edgequake_test:test_password_123@localhost:5432/edgequake_test
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
        run: |
          echo "Running SPEC-154 gap-close e2e gates..."
          cargo test -p edgequake-api --features postgres \
            --test e2e_spec154_web_refresh_rotation \
            --test e2e_spec154_jti_durable \
            --test e2e_spec154_ws_no_query_token \
            --test e2e_spec154_api_key_scopes \
            --test e2e_spec154_membership_bind_mcp \
            --test e2e_spec154_audience_parity \
            --test e2e_spec154_scope_predicate \
            --test e2e_spec154_startup_auth_off_fatal \
            --test e2e_spec154_anonymous_vs_mcp \
            -- --test-threads=1

      - name: Run All Integration Tests (optional)
        if: github.event.inputs.run_all_tests == 'true'
        working-directory: edgequake
        run: |
          echo "Running all integration tests..."
          cargo test --all --features postgres -- --test-threads=2

  postgres-age-tests:
    name: PostgreSQL AGE Graph Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres-age:
        # WHY: storage_backend_contract + migration bootstrap need pgvector + AGE (apache/age has AGE only).
        image: ghcr.io/raphaelmansuy/edgequake-postgres:latest
        env:
          POSTGRES_DB: edgequake_test
          POSTGRES_USER: edgequake_test
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgequake_test -d edgequake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 60s

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edgequake
          key: postgres-age

      - name: Wait for PostgreSQL with AGE
        run: |
          echo "Waiting for PostgreSQL with AGE extension to be ready..."
          for i in {1..60}; do
            if pg_isready -h localhost -p 5432 -U edgequake_test -d edgequake_test 2>/dev/null; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i: PostgreSQL not ready yet..."
            sleep 2
          done

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup database extensions
        run: |
          PGPASSWORD=test_password_123 psql -h localhost -p 5432 -U edgequake_test -d edgequake_test << 'EOSQL'
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS age;
            LOAD 'age';
            SET search_path = ag_catalog, "$user", public;
          EOSQL

      # WHY: Native graph write contracts (EDGEQUAKE_NATIVE_GRAPH_WRITES=1) need
      # eq_next_node_id / eq_next_edge_id from migrations 067/075. Graph initialize()
      # does not run sqlx migrations — without this step CI fails with
      # "function eq_next_node_id(unknown) does not exist".
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Run database migrations (native graph helpers)
        env:
          DATABASE_URL: postgresql://edgequake_test:test_password_123@localhost:5432/edgequake_test
        run: |
          sqlx migrate run \
            --source edgequake/migrations \
            --database-url "$DATABASE_URL"
          PGPASSWORD=test_password_123 psql -h localhost -p 5432 -U edgequake_test -d edgequake_test -c \
            "SELECT proname FROM pg_proc WHERE proname IN ('eq_next_node_id','eq_next_edge_id') ORDER BY 1;"

      - name: Run SPEC-017 storage backend contracts (postgres)
        working-directory: edgequake
        env:
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: edgequake_test
          POSTGRES_USER: edgequake_test
        run: |
          echo "Running SPEC-017 storage backend contract tests..."
          cargo test -p edgequake-storage --test storage_backend_contract --features postgres -- --test-threads=1
          cargo test -p edgequake-storage --test backend_e2e_contract --features postgres -- --test-threads=1
          cargo test -p edgequake-storage --test graph_isp_contract --features postgres -- --test-threads=1

      - name: Run SPEC-044 Cypher parameter + compensation tests (postgres)
        working-directory: edgequake
        env:
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: edgequake_test
          POSTGRES_USER: edgequake_test
        run: |
          echo "Running SPEC-044 parameterized Cypher + saga compensation tests..."
          cargo test -p edgequake-storage --test spec022_cypher_prepared_postgres --features postgres -- --test-threads=1
          cargo test -p edgequake-storage --test spec044_compensation_postgres --features postgres -- --test-threads=1

      - name: Run SPEC-006 migration bootstrap postgres e2e
        working-directory: edgequake
        env:
          DATABASE_URL: postgresql://edgequake_test:test_password_123@localhost:5432/edgequake_test
          POSTGRES_PASSWORD: test_password_123
        run: |
          echo "Running SPEC-006 migration bootstrap + readiness battle tests..."
          cargo test -p edgequake-api --test migration_bootstrap_proof --features postgres -- --test-threads=1
          cargo test -p edgequake-api --test migration_readiness_proof --features postgres -- --test-threads=1

      - name: Run PostgreSQL AGE Graph Tests
        working-directory: edgequake
        env:
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: edgequake_test
          POSTGRES_USER: edgequake_test
        run: |
          echo "Running PostgreSQL AGE graph integration tests..."
          cargo test --package edgequake-storage --test postgres_integration --features postgres -- test_postgres_age --test-threads=1

      - name: Run SPEC-106 graphid edges-batch E2E (Issue #356)
        working-directory: edgequake
        env:
          DATABASE_URL: postgresql://edgequake_test:test_password_123@localhost:5432/edgequake_test
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: edgequake_test
          POSTGRES_USER: edgequake_test
          EDGEQUAKE_REQUIRE_POSTGRES_TESTS: "1"
        run: |
          echo "Running SPEC-106 get_edges_for_nodes_batch ::text join regression..."
          cargo test -p edgequake-storage --features postgres --test e2e_spec106_graphid_edges_batch -- --test-threads=1

  coverage-postgres:
    # WHY: Tarpaulin across the PostgreSQL feature set is significantly slower
    # than the functional integration checks and is not a first-principles
    # release gate. Keep it available for manual coverage audits instead of
    # blocking normal pushes and release validation.
    if: github.event_name == 'workflow_dispatch'
    name: PostgreSQL Integration Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: ghcr.io/raphaelmansuy/edgequake-postgres:latest
        env:
          POSTGRES_DB: edgequake_test
          POSTGRES_USER: edgequake_test
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgequake_test -d edgequake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 60s

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-tarpaulin
        # WHY: Use pre-built binary to avoid compiling native-tls v0.2.17 which fails on Rust 1.85+
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edgequake
          key: postgres-coverage

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup database
        run: |
          PGPASSWORD=test_password_123 psql -h localhost -p 5432 -U edgequake_test -d edgequake_test << 'EOSQL'
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS age;
            LOAD 'age';
            SET search_path = ag_catalog, "$user", public;

            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN
                CREATE ROLE app_user WITH LOGIN PASSWORD 'app_password_123';
              END IF;
            END $$;

            GRANT CONNECT ON DATABASE edgequake_test TO app_user;
            GRANT USAGE ON SCHEMA public TO app_user;
            GRANT USAGE ON SCHEMA ag_catalog TO app_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user;
          EOSQL

          # Run migrations with strict error handling now that the service image contains both extensions
          for file in edgequake/migrations/*.sql; do
            echo "Applying migration: $file"
            PGPASSWORD=test_password_123 psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U edgequake_test -d edgequake_test -f "$file"
          done

          PGPASSWORD=test_password_123 psql -h localhost -p 5432 -U edgequake_test -d edgequake_test << 'EOSQL'
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
            GRANT edgequake_tenant_access TO app_user;
            GRANT SELECT ON ALL TABLES IN SCHEMA ag_catalog TO app_user;
          EOSQL

      - name: Generate PostgreSQL-specific coverage
        working-directory: edgequake
        # SPEC-083 / X-32: optional coverage audit (manual workflow_dispatch only) —
        # disk pressure on runners must not block required gates.
        continue-on-error: true
        run: |
          cargo tarpaulin \
            --packages edgequake-storage edgequake-api edgequake-tasks \
            --features postgres \
            --timeout 600 \
            --out xml \
            --output-dir ./coverage

      - name: Upload PostgreSQL coverage
        uses: codecov/codecov-action@v4
        with:
          files: edgequake/coverage/cobertura.xml
          flags: postgres-integration
          name: postgres-coverage
          fail_ci_if_error: false

  external-provider-tenancy:
    name: External provider tenancy contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/provider-access-test
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports: ["7474:7474"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edgequake
          key: external-provider-tenancy
      - name: Wait for both providers
        run: |
          set -euo pipefail
          for url in http://localhost:6333/readyz http://localhost:7474/; do
            ready=0
            for attempt in {1..60}; do
              if curl --fail --silent "$url" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1
          done
      - name: Require adapter isolation and measure reads
        working-directory: edgequake
        env:
          QDRANT_URL: http://localhost:6333
          NEO4J_URL: http://localhost:7474
          EDGEQUAKE_NEO4J_PASSWORD: provider-access-test
          EDGEQUAKE_REQUIRE_QDRANT: "1"
          EDGEQUAKE_REQUIRE_NEO4J: "1"
          EQ_TENANT_PROVIDER_REPORT_DIR: /tmp/tenant-providers
        run: |
          set -euo pipefail
          cargo test -p edgequake-storage --features full \
            --test e2e_spec149_qdrant --test e2e_spec149_neo4j \
            -- --test-threads=1 --nocapture
          cargo test -p edgequake-storage --features full --lib adapters::sqlite \
            -- --test-threads=1 --nocapture
          test -s /tmp/tenant-providers/qdrant.json
          test -s /tmp/tenant-providers/neo4j.json
          test -s /tmp/tenant-providers/sqlite.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-provider-tenancy
          path: /tmp/tenant-providers/*.json
