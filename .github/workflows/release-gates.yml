name: Release Gates

# Lean pre-release: workspace clippy once (not N× per-crate), skip lib suite
# (CI owns it), keep SPEC proofs + WebUI typecheck + version parity.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, edgequake-main]
    paths:
      - "edgequake/**"
      - "edgequake_webui/**"
      - "Makefile"
      - "scripts/release_gates.sh"
      - "VERSION"
      - "CHANGELOG.md"
      - ".github/workflows/release-gates.yml"
  push:
    branches: [main, edgequake-main]
    paths:
      - "edgequake/**"
      - "edgequake_webui/**"
      - "Makefile"
      - "scripts/release_gates.sh"
      - "VERSION"
      - "CHANGELOG.md"
      - ".github/workflows/release-gates.yml"

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_LOG: warn
  RUST_BACKTRACE: short

jobs:
  gates:
    name: Pre-release quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-key: release-gates
          save-if: ${{ github.ref == 'refs/heads/edgequake-main' || github.ref == 'refs/heads/main' }}

      - name: Install ripgrep (resource-proof scripts)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: edgequake_webui
        run: bun install

      - name: Free disk space (release gates compile many artifacts)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Run release gates
        env:
          DATABASE_URL: ""
          POSTGRES_PASSWORD: ""
          # Lib suite is owned by CI `test` — do not pay twice on every PR.
          RELEASE_SKIP_LIB_TESTS: "1"
          # Per-crate clippy loop is O(N) redundant with workspace clippy.
          RELEASE_SKIP_PER_CRATE_CLIPPY: "1"
        run: |
          chmod +x scripts/release_gates.sh
          ./scripts/release_gates.sh
