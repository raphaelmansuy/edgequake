<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>21_math_equations</title>
    <style>
        body { font-family: 'Times New Roman', serif; font-size: 12pt; margin: 2cm; }
        h1 { font-size: 24pt; font-weight: bold; }
        h2 { font-size: 18pt; font-weight: bold; }
        h3 { font-size: 14pt; font-weight: bold; }
        h4 { font-size: 12pt; font-weight: bold; }
        code { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 2px 4px; }
        pre { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 10px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background: #f0f0f0; font-weight: bold; }
        blockquote { border-left: 3px solid #ccc; padding-left: 10px; margin-left: 0; }
        .two-column { column-count: 2; column-gap: 20px; }
        img { max-width: 100%; }
    </style>
</head>
<body>
<h1 id="mathematical-equations">Mathematical Equations</h1>
<h2 id="inline-math">Inline Math</h2>
<p>The quadratic formula is <span class="math inline">$x = \frac{-b \pm
\sqrt{b^2 - 4ac}}{2a}$</span>.</p>
<p>Einstein’s famous equation: <span
class="math inline"><em>E</em> = <em>m</em><em>c</em><sup>2</sup></span>.</p>
<h2 id="display-math">Display Math</h2>
<p><span class="math display">$$
\int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}
$$</span></p>
<h2 id="matrix">Matrix</h2>
<p><span class="math display">$$
\begin{bmatrix}
a &amp; b \\
c &amp; d
\end{bmatrix}
$$</span></p>

</body>
</html>
