<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>10_all_header_levels</title>
    <style>
        body { font-family: 'Times New Roman', serif; font-size: 12pt; margin: 2cm; }
        h1 { font-size: 24pt; font-weight: bold; }
        h2 { font-size: 18pt; font-weight: bold; }
        h3 { font-size: 14pt; font-weight: bold; }
        h4 { font-size: 12pt; font-weight: bold; }
        code { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 2px 4px; }
        pre { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 10px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background: #f0f0f0; font-weight: bold; }
        blockquote { border-left: 3px solid #ccc; padding-left: 10px; margin-left: 0; }
        .two-column { column-count: 2; column-gap: 20px; }
        img { max-width: 100%; }
    </style>
</head>
<body>
<h1 id="header-level-1">Header Level 1</h1>
<p>This is content under H1.</p>
<h2 id="header-level-2">Header Level 2</h2>
<p>This is content under H2.</p>
<h3 id="header-level-3">Header Level 3</h3>
<p>This is content under H3.</p>
<h4 id="header-level-4">Header Level 4</h4>
<p>This is content under H4.</p>
<h5 id="header-level-5">Header Level 5</h5>
<p>This is content under H5.</p>
<h6 id="header-level-6">Header Level 6</h6>
<p>This is content under H6.</p>

</body>
</html>
