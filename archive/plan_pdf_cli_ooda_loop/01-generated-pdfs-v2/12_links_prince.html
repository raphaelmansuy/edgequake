<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>12_links</title>
    <style>
        body { font-family: 'Times New Roman', serif; font-size: 12pt; margin: 2cm; }
        h1 { font-size: 24pt; font-weight: bold; }
        h2 { font-size: 18pt; font-weight: bold; }
        h3 { font-size: 14pt; font-weight: bold; }
        h4 { font-size: 12pt; font-weight: bold; }
        code { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 2px 4px; }
        pre { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 10px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background: #f0f0f0; font-weight: bold; }
        blockquote { border-left: 3px solid #ccc; padding-left: 10px; margin-left: 0; }
        .two-column { column-count: 2; column-gap: 20px; }
        img { max-width: 100%; }
    </style>
</head>
<body>
<h1 id="links-and-references">Links and References</h1>
<h2 id="inline-links">Inline Links</h2>
<p>Visit <a href="https://www.google.com">Google</a> for search.</p>
<p>Check out <a href="https://github.com">GitHub</a> for code.</p>
<h2 id="email-links">Email Links</h2>
<p>Contact us at <a
href="mailto:email@example.com">email@example.com</a>.</p>
<h2 id="urls">URLs</h2>
<p>Direct URL: https://example.com/path/to/page</p>
<h2 id="link-with-title">Link with Title</h2>
<p><a href="https://example.com" title="Example Site">Link with
title</a></p>

</body>
</html>
