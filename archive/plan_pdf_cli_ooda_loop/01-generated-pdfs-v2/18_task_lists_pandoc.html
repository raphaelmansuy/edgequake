<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>18_task_lists</title>
    <style>
        body { font-family: 'Times New Roman', serif; font-size: 12pt; margin: 2cm; }
        h1 { font-size: 24pt; font-weight: bold; }
        h2 { font-size: 18pt; font-weight: bold; }
        h3 { font-size: 14pt; font-weight: bold; }
        h4 { font-size: 12pt; font-weight: bold; }
        code { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 2px 4px; }
        pre { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 10px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background: #f0f0f0; font-weight: bold; }
        blockquote { border-left: 3px solid #ccc; padding-left: 10px; margin-left: 0; }
        .two-column { column-count: 2; column-gap: 20px; }
        img { max-width: 100%; }
    </style>
</head>
<body>
<h1 id="task-lists">Task Lists</h1>
<h2 id="project-checklist">Project Checklist</h2>
<ul class="task-list">
<li><label><input type="checkbox" checked="" />Create project
structure</label></li>
<li><label><input type="checkbox" checked="" />Write initial
code</label></li>
<li><label><input type="checkbox" />Add unit tests</label></li>
<li><label><input type="checkbox" />Write documentation</label></li>
<li><label><input type="checkbox" />Deploy to production</label></li>
</ul>
<h2 id="shopping-list">Shopping List</h2>
<ul class="task-list">
<li><label><input type="checkbox" checked="" />Milk</label></li>
<li><label><input type="checkbox" checked="" />Bread</label></li>
<li><label><input type="checkbox" />Eggs</label></li>
<li><label><input type="checkbox" />Butter</label></li>
</ul>

</body>
</html>
