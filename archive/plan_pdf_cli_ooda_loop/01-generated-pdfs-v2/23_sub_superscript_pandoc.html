<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>23_sub_superscript</title>
    <style>
        body { font-family: 'Times New Roman', serif; font-size: 12pt; margin: 2cm; }
        h1 { font-size: 24pt; font-weight: bold; }
        h2 { font-size: 18pt; font-weight: bold; }
        h3 { font-size: 14pt; font-weight: bold; }
        h4 { font-size: 12pt; font-weight: bold; }
        code { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 2px 4px; }
        pre { font-family: 'Courier New', monospace; background: #f0f0f0; padding: 10px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background: #f0f0f0; font-weight: bold; }
        blockquote { border-left: 3px solid #ccc; padding-left: 10px; margin-left: 0; }
        .two-column { column-count: 2; column-gap: 20px; }
        img { max-width: 100%; }
    </style>
</head>
<body>
<h1 id="subscript-and-superscript">Subscript and Superscript</h1>
<h2 id="chemical-formulas">Chemical Formulas</h2>
<p>Water: H<sub>2</sub>O</p>
<p>Carbon Dioxide: CO<sub>2</sub></p>
<p>Sulfuric Acid: H<sub>2</sub>SO<sub>4</sub></p>
<h2 id="math-expressions">Math Expressions</h2>
<p>x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup></p>
<p>E = mc<sup>2</sup></p>
<h2 id="combined">Combined</h2>
<p>The formula H<sub>2</sub>O<sup>+</sup> represents a hydronium
ion.</p>

</body>
</html>
