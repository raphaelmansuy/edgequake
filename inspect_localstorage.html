<!DOCTYPE html>
<html>
<head>
  <title>EdgeQuake LocalStorage Inspector</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h1 {
      color: #4ec9b0;
    }
    .section {
      margin: 20px 0;
      padding: 15px;
      background: #252526;
      border-radius: 5px;
    }
    .key {
      color: #9cdcfe;
      font-weight: bold;
    }
    .value {
      color: #ce9178;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🔍 EdgeQuake LocalStorage Inspector</h1>
  <div id="output"></div>

  <script>
    const output = document.getElementById('output');

    // Keys to look for
    const relevantKeys = [
      'edgequake-tenant-store',
      'edgequake-tenant-context',
      'edgequake-workspace-initialized',
      'tenant-store-v2',
      'zustand-tenant-store'
    ];

    function displayStorage() {
      let html = '<div class="section">';
      html += '<h2>📦 LocalStorage Contents</h2>';
      
      // Check all localStorage keys
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && (key.includes('tenant') || key.includes('workspace') || key.includes('zustand') || key.includes('edgequake'))) {
          const value = localStorage.getItem(key);
          html += `<div style="margin: 10px 0; padding: 10px; background: #1e1e1e; border-left: 3px solid #4ec9b0;">`;
          html += `<div class="key">Key: ${key}</div>`;
          
          try {
            const parsed = JSON.parse(value || '{}');
            html += `<div class="value">${JSON.stringify(parsed, null, 2)}</div>`;
          } catch (e) {
            html += `<div class="value">${value}</div>`;
          }
          
          html += `</div>`;
        }
      }
      
      html += '</div>';
      output.innerHTML = html;
    }

    displayStorage();
  </script>
</body>
</html>
