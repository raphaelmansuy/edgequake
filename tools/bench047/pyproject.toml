[project]
name = "bench047"
version = "0.1.0"
description = "SPEC-047 EdgeQuake RAG evaluation on MMLongBench-Doc"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "huggingface_hub>=0.23",
  "pandas>=2.0",
  "pyarrow>=14",
  "openai>=1.30",
]

[project.scripts]
bench047 = "bench047.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bench047*"]
